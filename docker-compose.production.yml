# Production-local topology. This intentionally does not extend docker-compose.yml:
# development keeps its loopback-published infrastructure, while this file publishes
# only the web application and reuses the same claims-os named volumes.
name: claims-os-prod

services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - claims_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes:
      - claims_redis_data:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: cgr.dev/chainguard/minio@sha256:9cc9cf7bde067425120f37019f5c7f5d565737b2ee6ef66200c4c34e4b9b0fac
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
    volumes:
      - claims_minio_data:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:bd2d82883460ec07b5a29b44ba026fb864a1ebaed4b8bd8dc1575f3ab269af96
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env.production}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
    networks:
      - backend
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc anonymous set none "local/$$MINIO_BUCKET"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: claims-os-api
      API_HOST: 0.0.0.0
      API_PORT: 4000
      API_PUBLIC_URL: http://api:4000
      WEB_URL: ${WEB_PUBLIC_URL:?Set WEB_PUBLIC_URL in .env.production}
      CORS_ORIGINS: ${WEB_PUBLIC_URL:?Set WEB_PUBLIC_URL in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      REQUEST_LOGGING: 'true'
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-1000}
      AUTOMATION_INTERNAL_API_SECRET: ${AUTOMATION_INTERNAL_API_SECRET:?Set AUTOMATION_INTERNAL_API_SECRET in .env.production}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:?Set TELEGRAM_ALLOWED_CHAT_ID in .env.production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.production}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env.production}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
      OBJECT_STORAGE_SECURE: 'false'
      OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
      ATTACHMENT_ALLOWED_MIME_TYPES: image/jpeg,image/png,image/webp,application/pdf
      ATTACHMENT_MAX_BYTES: '10485760'
      ATTACHMENT_MAX_PER_EXPENSE: '10'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/api/v1/health/ready'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_APP_URL: ${WEB_PUBLIC_URL:?Set WEB_PUBLIC_URL in .env.production}
        NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS: ${NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS:?Set NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS in .env.production}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  n8n:
    image: n8nio/n8n@sha256:5450af5dbde41b9a770a1e4cc67752e256aa9898294c903f91dccb638eeb86cf
    restart: unless-stopped
    ports:
      - '127.0.0.1:${N8N_EDITOR_PORT:-5678}:5678'
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        if [ ! -f /home/node/.n8n/.claims-os-router-imported ]; then
        n8n import:workflow --input=/workflows/telegram-router.json &&
        touch /home/node/.n8n/.claims-os-router-imported;
        fi;
        exec n8n start
    environment:
      N8N_HOST: n8n
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_USER_FOLDER: /home/node/.n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env.production}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_RUNNERS_ENABLED: 'true'
      DB_SQLITE_POOL_SIZE: '2'
      N8N_GIT_NODE_DISABLE_BARE_REPOS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_SECURE_COOKIE: 'false'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env.production}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:?Set TELEGRAM_ALLOWED_CHAT_ID in .env.production}
      GATEWAY_N8N_SECRET: ${GATEWAY_N8N_SECRET:?Set GATEWAY_N8N_SECRET in .env.production}
      APP_INTERNAL_API_URL: http://api:4000/api/v1
      AUTOMATION_INTERNAL_API_SECRET: ${AUTOMATION_INTERNAL_API_SECRET:?Set AUTOMATION_INTERNAL_API_SECRET in .env.production}
    volumes:
      - claims_n8n_data:/home/node/.n8n
      - ./apps/n8n/workflows:/workflows:ro
    networks:
      - backend
      - egress
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:5678/healthz'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  telegram-gateway:
    build:
      context: .
      dockerfile: apps/telegram-gateway/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env.production}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:?Set TELEGRAM_ALLOWED_CHAT_ID in .env.production}
      N8N_GATEWAY_WEBHOOK_URL: http://n8n:5678/webhook/telegram-update
      GATEWAY_N8N_SECRET: ${GATEWAY_N8N_SECRET:?Set GATEWAY_N8N_SECRET in .env.production}
      TELEGRAM_GATEWAY_STATE_PATH: /data/state.json
      TELEGRAM_POLL_TIMEOUT_SECONDS: '25'
    volumes:
      - claims_telegram_gateway_data:/data
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - backend
      - egress
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8080/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  frontend:
    name: claims-os-prod_frontend
  backend:
    name: claims-os-prod_backend
    internal: true
  egress:
    name: claims-os-prod_egress

volumes:
  # Deliberately distinct from development's `claims-os_*` volumes. Compose
  # never deletes them unless an operator deliberately passes `down --volumes`.
  claims_minio_data:
    name: claims-os-prod_claims_minio_data
  claims_postgres_data:
    name: claims-os-prod_claims_postgres_data
  claims_redis_data:
    name: claims-os-prod_claims_redis_data
  claims_n8n_data:
    name: claims-os-prod_claims_n8n_data
  claims_telegram_gateway_data:
    name: claims-os-prod_claims_telegram_gateway_data
