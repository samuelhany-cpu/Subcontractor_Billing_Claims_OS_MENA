openapi: 3.1.0
info:
  title: Local Project Expense Tracker API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /projects:
    get:
      operationId: listProjects
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [ACTIVE, ARCHIVED, ALL], default: ALL }
      responses:
        "200":
          description: Projects returned with exact totals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}:
    get:
      operationId: getProject
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Project returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: Active project updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Project archived with related records retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/restore:
    post:
      operationId: restoreProject
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Archived project restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/dashboard:
    get:
      operationId: getProjectDashboard
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Minimal project summary returned without charts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDashboard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /categories:
    get:
      operationId: listCategories
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ClassificationFilter" }
      responses:
        "200":
          description: Ordered category trees returned; status defaults to ACTIVE and applies to parent categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationNameInput" }
      responses:
        "201":
          description: Category created active at the end of the global order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/reorder:
    post:
      operationId: reorderCategories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteReorder" }
      responses:
        "200":
          description: All active and inactive categories reordered atomically
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /categories/{categoryId}:
    patch:
      operationId: renameCategory
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationNameInput" }
      responses:
        "200":
          description: Category renamed in place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{categoryId}/deactivate:
    post:
      operationId: deactivateCategory
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      responses:
        "200":
          description: Category deactivated without changing or deleting its children or historical references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{categoryId}/reactivate:
    post:
      operationId: reactivateCategory
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      responses:
        "200":
          description: Category reactivated with the same identity and child states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{categoryId}/subcategories:
    post:
      operationId: createSubcategory
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationNameInput" }
      responses:
        "201":
          description: Subcategory created active at the end of its parent order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{categoryId}/subcategories/reorder:
    post:
      operationId: reorderSubcategories
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteReorder" }
      responses:
        "200":
          description: All active and inactive children of the parent reordered atomically
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /subcategories/{subcategoryId}:
    patch:
      operationId: renameSubcategory
      parameters: [{ $ref: "#/components/parameters/SubcategoryId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationNameInput" }
      responses:
        "200":
          description: Subcategory renamed in place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /subcategories/{subcategoryId}/deactivate:
    post:
      operationId: deactivateSubcategory
      parameters: [{ $ref: "#/components/parameters/SubcategoryId" }]
      responses:
        "200":
          description: Subcategory deactivated without deletion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /subcategories/{subcategoryId}/reactivate:
    post:
      operationId: reactivateSubcategory
      parameters: [{ $ref: "#/components/parameters/SubcategoryId" }]
      responses:
        "200":
          description: Subcategory reactivated with the same identity and order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /expenses:
    get:
      operationId: listExpenses
      parameters:
        - in: query
          name: projectId
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: categoryId
          schema: { type: string, format: uuid }
        - in: query
          name: subcategoryId
          schema: { type: string, format: uuid }
        - in: query
          name: payeeId
          schema: { type: string, format: uuid }
        - in: query
          name: paymentMethod
          schema: { type: string, maxLength: 120 }
        - in: query
          name: source
          schema: { $ref: "#/components/schemas/ExpenseSource" }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ExpenseStatus" }
        - in: query
          name: search

          schema: { type: string, maxLength: 200 }
        - in: query
          name: sort
          schema:
            $ref: "#/components/schemas/ExpenseSort"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Active Expenses returned using inclusive date boundaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpenseList" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExpense" }
      responses:
        "201":
          description: Expense created with trusted WEB source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /expenses/{expenseId}:
    get:
      operationId: getExpense
      parameters: [{ $ref: "#/components/parameters/ExpenseId" }]
      responses:
        "200":
          description: Active Expense returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateExpense
      parameters: [{ $ref: "#/components/parameters/ExpenseId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExpense" }
      responses:
        "200":
          description: Active Expense updated without changing Project or source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /expenses/{expenseId}/delete:
    post:
      operationId: deleteExpense
      summary: Soft-delete an expense
      parameters: [{ $ref: "#/components/parameters/ExpenseId" }]
      responses:
        "200":
          description: Expense soft-deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /expenses/{expenseId}/restore:
    post:
      operationId: restoreExpense
      summary: Restore a soft-deleted expense
      parameters: [{ $ref: "#/components/parameters/ExpenseId" }]
      responses:
        "200":
          description: Expense restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /expenses/{expenseId}/attachments:

    get:
      operationId: listExpenseAttachments
      parameters: [{ $ref: "#/components/parameters/ExpenseId" }]
      responses:
        "200":
          description: Private Attachment metadata returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: uploadExpenseAttachment
      parameters: [{ $ref: "#/components/parameters/ExpenseId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP, or PDF; non-empty and at most 10 MiB
      responses:
        "201":
          description: Private Attachment uploaded and metadata recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /attachments/{attachmentId}/content:
    get:
      operationId: streamAttachmentContent
      parameters:
        - in: path
          name: attachmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private Attachment content streamed with no-store headers
          headers:
            Cache-Control:
              schema: { type: string, const: "private, no-store" }
            Content-Disposition:
              schema: { type: string }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /transfers:
    get:
      operationId: listTransfers
      summary: List incoming project funding transfers
      parameters:
        - in: query
          name: projectId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/TransferStatus" }
        - in: query
          name: sort
          schema: { $ref: "#/components/schemas/TransferSort" }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Transfers returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferListResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createTransfer
      summary: Create new incoming project funding transfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTransfer" }
      responses:
        "201":
          description: Transfer created successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /transfers/{transferId}:
    get:
      operationId: getTransfer
      summary: Retrieve single transfer detail (active or soft-deleted)
      parameters:
        - in: path
          name: transferId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transfer details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTransfer
      summary: Update transfer date or amount
      parameters:
        - in: path
          name: transferId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTransfer" }
      responses:
        "200":
          description: Transfer updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /transfers/{transferId}/delete:
    post:
      operationId: deleteTransfer
      summary: Soft-delete an incoming transfer
      parameters:
        - in: path
          name: transferId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transfer soft-deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /transfers/{transferId}/restore:
    post:
      operationId: restoreTransfer
      summary: Restore a soft-deleted transfer
      parameters:
        - in: path
          name: transferId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transfer restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /payees:
    get:
      operationId: listPayees
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/PayeeFilter" }
        - in: query
          name: search
          description: Trimmed literal substring matched server-side against name, company name, phone, and specialty
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Payees returned in deterministic name and id order with grouped non-deleted Expense totals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payee" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createPayee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePayee" }
      responses:
        "201":
          description: Global Payee created; names are intentionally non-unique
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payee" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /payees/{payeeId}:
    get:
      operationId: getPayee
      parameters: [{ $ref: "#/components/parameters/PayeeId" }]
      responses:
        "200":
          description: Payee returned with exact global total and qualifying Project summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayeeDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updatePayee
      parameters: [{ $ref: "#/components/parameters/PayeeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePayee" }
      responses:
        "200":
          description: Payee updated in place while preserving historical links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payee" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /payees/{payeeId}/deactivate:
    post:
      operationId: deactivatePayee
      parameters: [{ $ref: "#/components/parameters/PayeeId" }]
      responses:
        "200":
          description: Payee deactivated without deleting Expenses or Agreements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payee" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /payees/{payeeId}/reactivate:
    post:
      operationId: reactivatePayee
      parameters: [{ $ref: "#/components/parameters/PayeeId" }]
      responses:
        "200":
          description: Payee reactivated using the same identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payee" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/payees/{payeeId}/agreement:
    get:
      operationId: getAgreement
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/PayeeId" }
      responses:
        "200":
          description: Agreement returned with exact derived paid, remaining, and overpayment values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAgreement
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/PayeeId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgreementInput" }
      responses:
        "201":
          description: Agreement created for the active Project and Payee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      operationId: updateAgreement
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/PayeeId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgreementInput" }
      responses:
        "200":
          description: Existing Agreement updated for the active Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agreement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /reports/expenses.xlsx:
    get:
      operationId: exportExpensesExcel
      parameters:
        - in: query
          name: projectId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /imports/excel/preview:
    post:
      operationId: previewExcelImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [projectId, file]
              properties:
                projectId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        "200": { description: Import preview }
  /imports/excel/{importJobId}/commit:
    post:
      operationId: commitExcelImport
      parameters:
        - in: path
          name: importJobId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Import committed }
  /automation/drafts:
    post:
      operationId: createAutomationDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationDraftInput" }
      responses:
        "201": { description: Draft created }
  /automation/drafts/{draftId}/confirm:
    post:
      operationId: confirmAutomationDraft
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Draft confirmed idempotently }
  /automation/drafts/{draftId}/cancel:
    post:
      operationId: cancelAutomationDraft
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Draft cancelled }
components:
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Requested resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Resource uniqueness or state conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Uploaded file exceeds the configured 10 MiB limit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Uploaded content signature and MIME policy do not match
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: A required private infrastructure dependency is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    ExpenseId:
      in: path
      name: expenseId
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema: { type: string, format: uuid }
    SubcategoryId:
      in: path
      name: subcategoryId
      required: true
      schema: { type: string, format: uuid }
    PayeeId:
      in: path
      name: payeeId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      examples: ["10000.00"]
    SignedMoney:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      examples: ["-100.00", "0.00", "10000.00"]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    ProjectTotals:
      type: object
      required: [totalIncomingTransfers, totalExpenses, totalFunding, availableBalance, expenseCount]
      properties:
        totalIncomingTransfers: { $ref: "#/components/schemas/Money" }
        totalExpenses: { $ref: "#/components/schemas/Money" }
        totalFunding: { $ref: "#/components/schemas/SignedMoney" }
        availableBalance: { $ref: "#/components/schemas/SignedMoney" }
        expenseCount: { type: integer, minimum: 0 }
    Project:
      type: object
      required: [id, name, status, openingBalance, openingBalanceDate, archivedAt, createdAt, updatedAt, totals]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        openingBalance: { $ref: "#/components/schemas/SignedMoney" }
        openingBalanceDate: { type: [string, "null"], format: date }
        archivedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        totals: { $ref: "#/components/schemas/ProjectTotals" }
    ProjectDashboard:
      allOf:
        - { $ref: "#/components/schemas/ProjectTotals" }
        - type: object
          required: [projectId, status, openingBalance]
          properties:
            projectId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/ProjectStatus" }
            openingBalance: { $ref: "#/components/schemas/SignedMoney" }
    CreateProject:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        openingBalance: { $ref: "#/components/schemas/SignedMoney" }
        openingBalanceDate: { type: [string, "null"], format: date }
    UpdateProject:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        openingBalance: { $ref: "#/components/schemas/SignedMoney" }
        openingBalanceDate: { type: [string, "null"], format: date }
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message: { type: string }
    ClassificationFilter:
      type: string
      enum: [ACTIVE, INACTIVE, ALL]
      default: ACTIVE
    ClassificationNameInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    CompleteReorder:
      type: object
      additionalProperties: false
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Complete ordered list including active and inactive records in scope
          items: { type: string, format: uuid }
    Subcategory:
      type: object
      required: [id, categoryId, name, sortOrder, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, sortOrder, isActive, createdAt, updatedAt, subcategories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        subcategories:
          type: array
          description: All active and inactive children, ordered by sortOrder then id
          items: { $ref: "#/components/schemas/Subcategory" }
    ExpenseSource:
      type: string
      enum: [WEB, TELEGRAM, EXCEL_IMPORT]
    ExpenseSort:
      type: string
      enum: [NEWEST, OLDEST]
      default: NEWEST
    PositiveExpenseMoney:
      type: string
      pattern: '^(?=.*[1-9])(?:0|[1-9]\d{0,15})(?:\.\d{1,2})?$'
      examples: ["10000.00"]
    PositivePreciseDecimal:
      type: string
      pattern: '^(?=.*[1-9])(?:0|[1-9]\d{0,13})(?:\.\d{1,4})?$'
      examples: ["3.0000", "12150.0000"]
    ExpenseWritableFields:
      type: object
      properties:
        expenseDate: { type: string, format: date }
        description: { type: string, minLength: 1, maxLength: 10000 }
        categoryId: { type: string, format: uuid }
        subcategoryId: { type: [string, "null"], format: uuid }
        payeeId: { type: [string, "null"], format: uuid }
        invoiceNumber: { type: [string, "null"], maxLength: 160 }
        quantity:
          oneOf:
            - { $ref: "#/components/schemas/PositivePreciseDecimal" }
            - { type: "null" }
        unit: { type: [string, "null"], maxLength: 80 }
        unitPrice:
          oneOf:
            - { $ref: "#/components/schemas/PositivePreciseDecimal" }
            - { type: "null" }
        amount:
          oneOf:
            - { $ref: "#/components/schemas/PositiveExpenseMoney" }
            - { type: "null" }
        paymentMethod: { type: [string, "null"], maxLength: 120 }
        notes: { type: [string, "null"], maxLength: 10000 }
    CreateExpense:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/ExpenseWritableFields" }
        - type: object
          required: [projectId, expenseDate, description, categoryId]
          properties:
            projectId: { type: string, format: uuid }
          oneOf:
            - description: Calculated mode; amount is prohibited
              required: [quantity, unitPrice]
              properties:
                quantity: { $ref: "#/components/schemas/PositivePreciseDecimal" }
                unitPrice: { $ref: "#/components/schemas/PositivePreciseDecimal" }
              not: { required: [amount] }
            - description: Manual mode; both calculation inputs cannot coexist
              required: [amount]
              properties:
                amount: { $ref: "#/components/schemas/PositiveExpenseMoney" }
              not: { required: [quantity, unitPrice] }
    UpdateExpense:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/ExpenseWritableFields" }
        - type: object
          minProperties: 1
          description: Project and source are immutable. Financial changes are validated against the merged stored state using the CreateExpense amount union.
    ExpenseProjectSummary:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
    ExpenseClassificationSummary:
      type: object
      additionalProperties: false
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }
    ExpensePayeeSummary:
      type: object
      additionalProperties: false
      required: [id, name, type, companyName, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/PayeeType" }
        companyName: { type: [string, "null"] }
        isActive: { type: boolean }
    Attachment:
      type: object
      additionalProperties: false
      required: [id, expenseId, originalName, mimeType, sizeBytes, sha256, createdAt]
      properties:
        id: { type: string, format: uuid }
        expenseId: { type: string, format: uuid }
        originalName: { type: string, minLength: 1, maxLength: 260 }
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        sizeBytes:
          type: string
          pattern: '^\d+$'
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        createdAt: { type: string, format: date-time }
    ExpenseStatus:
      type: string
      enum: [ACTIVE, DELETED, ALL]
      default: ACTIVE
    Expense:
      type: object
      additionalProperties: false
      required: [id, project, expenseDate, description, category, subcategory, payee, invoiceNumber, quantity, unit, unitPrice, amount, paymentMethod, notes, source, importFileName, importSheet, importRow, telegramChatId, telegramMsgId, attachments, deletedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        project: { $ref: "#/components/schemas/ExpenseProjectSummary" }
        expenseDate: { type: string, format: date }
        description: { type: string }
        category:
          oneOf:
            - { $ref: "#/components/schemas/ExpenseClassificationSummary" }
            - { type: "null" }
        subcategory:
          oneOf:
            - { $ref: "#/components/schemas/ExpenseClassificationSummary" }
            - { type: "null" }
        payee:
          oneOf:
            - { $ref: "#/components/schemas/ExpensePayeeSummary" }
            - { type: "null" }
        invoiceNumber: { type: [string, "null"] }
        quantity:
          oneOf:
            - { $ref: "#/components/schemas/PositivePreciseDecimal" }
            - { type: "null" }
        unit: { type: [string, "null"] }
        unitPrice:
          oneOf:
            - { $ref: "#/components/schemas/PositivePreciseDecimal" }
            - { type: "null" }
        amount: { $ref: "#/components/schemas/Money" }
        paymentMethod: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        source: { $ref: "#/components/schemas/ExpenseSource" }
        importFileName: { type: [string, "null"] }
        importSheet: { type: [string, "null"] }
        importRow: { type: [integer, "null"] }
        telegramChatId: { type: [string, "null"] }
        telegramMsgId: { type: [string, "null"] }
        attachments:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/Attachment" }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Pagination:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ExpenseList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Expense" }
        pagination: { $ref: "#/components/schemas/Pagination" }
    TransferInput:
      type: object
      required: [projectId, transferDate, amount]
      properties:
        projectId: { type: string, format: uuid }
        transferDate: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        source: { type: string, enum: [WEB, TELEGRAM, EXCEL_IMPORT] }
    PayeeType:
      type: string
      enum: [SUPPLIER, CRAFTSMAN, WORKER, COMPANY, OTHER]
    PayeeFilter:
      type: string
      enum: [ACTIVE, INACTIVE, ALL]
      default: ACTIVE
    PayeeFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { $ref: "#/components/schemas/PayeeType" }
        specialty: { type: [string, "null"], maxLength: 160 }
        phone: { type: [string, "null"], maxLength: 80 }
        companyName: { type: [string, "null"], maxLength: 200 }
        notes: { type: [string, "null"] }
    CreatePayee:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/PayeeFields" }
        - type: object
          required: [name, type]
    UpdatePayee:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/PayeeFields" }
        - type: object
          minProperties: 1
    Payee:
      allOf:
        - { $ref: "#/components/schemas/PayeeFields" }
        - type: object
          required: [id, name, type, specialty, phone, companyName, notes, isActive, totalPaid, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            isActive: { type: boolean }
            totalPaid: { $ref: "#/components/schemas/Money" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AgreementFinancialSummary:
      type: object
      required: [id, totalAmount, paidAmount, remainingAmount, overpaidAmount, notes, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        totalAmount: { $ref: "#/components/schemas/Money" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        remainingAmount: { $ref: "#/components/schemas/SignedMoney" }
        overpaidAmount: { $ref: "#/components/schemas/Money" }
        notes: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PayeeProjectSummary:
      type: object
      required: [projectId, projectName, projectStatus, paidAmount, agreement]
      description: Included only when an Agreement or at least one non-deleted Expense exists for this Project and Payee
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        projectStatus: { $ref: "#/components/schemas/ProjectStatus" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        agreement:
          oneOf:
            - { $ref: "#/components/schemas/AgreementFinancialSummary" }
            - { type: "null" }
    PayeeDetail:
      allOf:
        - { $ref: "#/components/schemas/Payee" }
        - type: object
          required: [projects]
          properties:
            projects:
              type: array
              items: { $ref: "#/components/schemas/PayeeProjectSummary" }
    AgreementInput:
      type: object
      additionalProperties: false
      required: [totalAmount]
      properties:
        totalAmount:
          type: string
          pattern: '^(?=.*[1-9])(?:0|[1-9]\d{0,15})(?:\.\d{1,2})?$'
          examples: ["36450.00"]
        notes: { type: [string, "null"] }
    Agreement:
      allOf:
        - { $ref: "#/components/schemas/AgreementFinancialSummary" }
        - type: object
          required: [projectId, projectName, projectStatus, payeeId, payeeName]
          properties:
            projectId: { type: string, format: uuid }
            projectName: { type: string }
            projectStatus: { $ref: "#/components/schemas/ProjectStatus" }
            payeeId: { type: string, format: uuid }
            payeeName: { type: string }
    AutomationDraftInput:
      type: object
      required: [telegramChatId, intent, payload, idempotencyKey]
      properties:
        telegramChatId: { type: string }
        telegramMsgId: { type: [string, "null"] }
        intent:
          type: string
          enum:
            - ADD_EXPENSE
            - ADD_TRANSFER
            - EDIT_LAST_EXPENSE
            - DELETE_LAST_EXPENSE
            - QUERY_TODAY_EXPENSES
            - QUERY_WEEK_EXPENSES
            - QUERY_BALANCE
            - QUERY_PAYEE_TOTAL
            - EXPORT_EXCEL
        payload: { type: object, additionalProperties: true }
        idempotencyKey: { type: string }
    TransferStatus:
      type: string
      enum: [ACTIVE, DELETED, ALL]
    TransferSort:
      type: string
      enum: [NEWEST, OLDEST]
    CreateTransfer:
      type: object
      additionalProperties: false
      required: [projectId, transferDate, amount]
      properties:
        projectId: { type: string, format: uuid }
        transferDate: { type: string, format: date }
        amount:
          type: string
          pattern: '^(?=.*[1-9])(?:0|[1-9]\d{0,15})(?:\.\d{1,2})?$'
          examples: ["10000.00"]
    UpdateTransfer:
      type: object
      additionalProperties: false
      properties:
        transferDate: { type: string, format: date }
        amount:
          type: string
          pattern: '^(?=.*[1-9])(?:0|[1-9]\d{0,15})(?:\.\d{1,2})?$'
          examples: ["15000.00"]
    TransferProjectSummary:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/ProjectStatus" }
    Transfer:
      type: object
      required: [id, projectId, project, transferDate, amount, source, deletedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        project: { $ref: "#/components/schemas/TransferProjectSummary" }
        transferDate: { type: string, format: date }
        amount:
          type: string
          pattern: '^(?=.*[1-9])(?:0|[1-9]\d{0,15})(?:\.\d{1,2})?$'
        source: { $ref: "#/components/schemas/RecordSource" }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransferListResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transfer" }
        pagination: { $ref: "#/components/schemas/PaginationMetadata" }
