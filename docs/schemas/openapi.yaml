openapi: 3.1.0
info:
  title: Local Project Expense Tracker API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /projects:
    get:
      operationId: listProjects
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [ACTIVE, ARCHIVED, ALL], default: ALL }
      responses:
        "200":
          description: Projects returned with exact totals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}:
    get:
      operationId: getProject
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Project returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProject
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProject" }
      responses:
        "200":
          description: Active project updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/archive:
    post:
      operationId: archiveProject
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Project archived with related records retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/restore:
    post:
      operationId: restoreProject
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Archived project restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/dashboard:
    get:
      operationId: getProjectDashboard
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Minimal project summary returned without charts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDashboard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /categories:
    get:
      operationId: listCategories
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/ClassificationFilter" }
      responses:
        "200":
          description: Ordered category trees returned; status defaults to ACTIVE and applies to parent categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationNameInput" }
      responses:
        "201":
          description: Category created active at the end of the global order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/reorder:
    post:
      operationId: reorderCategories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteReorder" }
      responses:
        "200":
          description: All active and inactive categories reordered atomically
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /categories/{categoryId}:
    patch:
      operationId: renameCategory
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationNameInput" }
      responses:
        "200":
          description: Category renamed in place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{categoryId}/deactivate:
    post:
      operationId: deactivateCategory
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      responses:
        "200":
          description: Category deactivated without changing or deleting its children or historical references
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{categoryId}/reactivate:
    post:
      operationId: reactivateCategory
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      responses:
        "200":
          description: Category reactivated with the same identity and child states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{categoryId}/subcategories:
    post:
      operationId: createSubcategory
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationNameInput" }
      responses:
        "201":
          description: Subcategory created active at the end of its parent order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /categories/{categoryId}/subcategories/reorder:
    post:
      operationId: reorderSubcategories
      parameters: [{ $ref: "#/components/parameters/CategoryId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteReorder" }
      responses:
        "200":
          description: All active and inactive children of the parent reordered atomically
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /subcategories/{subcategoryId}:
    patch:
      operationId: renameSubcategory
      parameters: [{ $ref: "#/components/parameters/SubcategoryId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassificationNameInput" }
      responses:
        "200":
          description: Subcategory renamed in place
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /subcategories/{subcategoryId}/deactivate:
    post:
      operationId: deactivateSubcategory
      parameters: [{ $ref: "#/components/parameters/SubcategoryId" }]
      responses:
        "200":
          description: Subcategory deactivated without deletion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /subcategories/{subcategoryId}/reactivate:
    post:
      operationId: reactivateSubcategory
      parameters: [{ $ref: "#/components/parameters/SubcategoryId" }]
      responses:
        "200":
          description: Subcategory reactivated with the same identity and order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subcategory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /expenses:
    get:
      operationId: listExpenses
      parameters:
        - in: query
          name: projectId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: categoryId
          schema: { type: string, format: uuid }
        - in: query
          name: payeeId
          schema: { type: string, format: uuid }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200": { description: Expenses returned }
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201": { description: Expense created }
  /expenses/{expenseId}:
    patch:
      operationId: updateExpense
      parameters: [ { $ref: "#/components/parameters/ExpenseId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "200": { description: Expense updated }
    delete:
      operationId: deleteExpense
      parameters: [ { $ref: "#/components/parameters/ExpenseId" } ]
      responses:
        "204": { description: Expense moved to recycle bin }
  /expenses/{expenseId}/restore:
    post:
      operationId: restoreExpense
      parameters: [ { $ref: "#/components/parameters/ExpenseId" } ]
      responses:
        "200": { description: Expense restored }
  /transfers:
    get:
      operationId: listTransfers
      parameters:
        - in: query
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Transfers returned }
    post:
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferInput" }
      responses:
        "201": { description: Transfer created }
  /payees:
    get:
      operationId: listPayees
      responses:
        "200": { description: Payees returned }
    post:
      operationId: createPayee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayeeInput" }
      responses:
        "201": { description: Payee created }
  /projects/{projectId}/payees/{payeeId}/agreement:
    put:
      operationId: upsertAgreement
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/PayeeId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totalAmount]
              properties:
                totalAmount: { $ref: "#/components/schemas/Money" }
                notes: { type: [string, "null"] }
      responses:
        "200": { description: Agreement saved }
  /reports/expenses.xlsx:
    get:
      operationId: exportExpensesExcel
      parameters:
        - in: query
          name: projectId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Excel workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /imports/excel/preview:
    post:
      operationId: previewExcelImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [projectId, file]
              properties:
                projectId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        "200": { description: Import preview }
  /imports/excel/{importJobId}/commit:
    post:
      operationId: commitExcelImport
      parameters:
        - in: path
          name: importJobId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Import committed }
  /automation/drafts:
    post:
      operationId: createAutomationDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationDraftInput" }
      responses:
        "201": { description: Draft created }
  /automation/drafts/{draftId}/confirm:
    post:
      operationId: confirmAutomationDraft
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Draft confirmed idempotently }
  /automation/drafts/{draftId}/cancel:
    post:
      operationId: cancelAutomationDraft
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Draft cancelled }
components:
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Requested resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Resource uniqueness or state conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    ExpenseId:
      in: path
      name: expenseId
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema: { type: string, format: uuid }
    SubcategoryId:
      in: path
      name: subcategoryId
      required: true
      schema: { type: string, format: uuid }
    PayeeId:
      in: path
      name: payeeId
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      examples: ["10000.00"]
    SignedMoney:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      examples: ["-100.00", "0.00", "10000.00"]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    ProjectTotals:
      type: object
      required: [totalIncomingTransfers, totalExpenses, totalFunding, availableBalance, expenseCount]
      properties:
        totalIncomingTransfers: { $ref: "#/components/schemas/Money" }
        totalExpenses: { $ref: "#/components/schemas/Money" }
        totalFunding: { $ref: "#/components/schemas/SignedMoney" }
        availableBalance: { $ref: "#/components/schemas/SignedMoney" }
        expenseCount: { type: integer, minimum: 0 }
    Project:
      type: object
      required: [id, name, status, openingBalance, openingBalanceDate, archivedAt, createdAt, updatedAt, totals]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/ProjectStatus" }
        openingBalance: { $ref: "#/components/schemas/SignedMoney" }
        openingBalanceDate: { type: [string, "null"], format: date }
        archivedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        totals: { $ref: "#/components/schemas/ProjectTotals" }
    ProjectDashboard:
      allOf:
        - { $ref: "#/components/schemas/ProjectTotals" }
        - type: object
          required: [projectId, status, openingBalance]
          properties:
            projectId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/ProjectStatus" }
            openingBalance: { $ref: "#/components/schemas/SignedMoney" }
    CreateProject:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        openingBalance: { $ref: "#/components/schemas/SignedMoney" }
        openingBalanceDate: { type: [string, "null"], format: date }
    UpdateProject:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        openingBalance: { $ref: "#/components/schemas/SignedMoney" }
        openingBalanceDate: { type: [string, "null"], format: date }
    Problem:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message: { type: string }
    ClassificationFilter:
      type: string
      enum: [ACTIVE, INACTIVE, ALL]
      default: ACTIVE
    ClassificationNameInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    CompleteReorder:
      type: object
      additionalProperties: false
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Complete ordered list including active and inactive records in scope
          items: { type: string, format: uuid }
    Subcategory:
      type: object
      required: [id, categoryId, name, sortOrder, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Category:
      type: object
      required: [id, name, sortOrder, isActive, createdAt, updatedAt, subcategories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        subcategories:
          type: array
          description: All active and inactive children, ordered by sortOrder then id
          items: { $ref: "#/components/schemas/Subcategory" }
    ExpenseInput:
      type: object
      required: [projectId, expenseDate, description]
      oneOf:
        - required: [amount]
        - required: [quantity, unitPrice]
      properties:
        projectId: { type: string, format: uuid }
        expenseDate: { type: string, format: date }
        description: { type: string, minLength: 1 }
        categoryId: { type: [string, "null"], format: uuid }
        subcategoryId: { type: [string, "null"], format: uuid }
        payeeId: { type: [string, "null"], format: uuid }
        invoiceNumber: { type: [string, "null"] }
        quantity: { type: [string, "null"] }
        unit: { type: [string, "null"] }
        unitPrice: { type: [string, "null"] }
        amount: { $ref: "#/components/schemas/Money" }
        paymentMethod: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        source: { type: string, enum: [WEB, TELEGRAM, EXCEL_IMPORT] }
    TransferInput:
      type: object
      required: [projectId, transferDate, amount]
      properties:
        projectId: { type: string, format: uuid }
        transferDate: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        source: { type: string, enum: [WEB, TELEGRAM, EXCEL_IMPORT] }
    PayeeInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [SUPPLIER, CRAFTSMAN, WORKER, COMPANY, OTHER] }
        specialty: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        companyName: { type: [string, "null"] }
        notes: { type: [string, "null"] }
    AutomationDraftInput:
      type: object
      required: [telegramChatId, intent, payload, idempotencyKey]
      properties:
        telegramChatId: { type: string }
        telegramMsgId: { type: [string, "null"] }
        intent:
          type: string
          enum:
            - ADD_EXPENSE
            - ADD_TRANSFER
            - EDIT_LAST_EXPENSE
            - DELETE_LAST_EXPENSE
            - QUERY_TODAY_EXPENSES
            - QUERY_WEEK_EXPENSES
            - QUERY_BALANCE
            - QUERY_PAYEE_TOTAL
            - EXPORT_EXCEL
        payload: { type: object, additionalProperties: true }
        idempotencyKey: { type: string }
