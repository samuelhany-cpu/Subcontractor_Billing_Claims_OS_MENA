openapi: 3.0.3
info:
  title: Subcontractor Billing & Claims OS API
  version: 0.1.0
  description: MVP REST API contract. Expand endpoint schemas during implementation.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Projects
  - name: Contracts
  - name: BOQ
  - name: Progress
  - name: Applications
  - name: Variations
  - name: Certificates
  - name: Invoices
  - name: Payments
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Report API process liveness without checking dependencies
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
  /health/ready:
    get:
      tags: [Health]
      summary: Report readiness of required runtime dependencies
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: All required dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: One or more required dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /projects:
    get:
      tags: [Projects]
      summary: List accessible projects
      responses:
        '200':
          description: Project page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get project
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}/contracts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Contracts]
      summary: Create contract draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContract'
      responses:
        '201':
          description: Contract created
  /contracts/{contractId}/boq-imports:
    post:
      tags: [BOQ]
      summary: Start BOQ import
      parameters:
        - $ref: '#/components/parameters/ContractId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, mapping]
              properties:
                documentId: {type: string, format: uuid}
                mapping: {type: object, additionalProperties: true}
      responses:
        '202':
          description: Import job accepted
  /contracts/{contractId}/valuation-periods:
    post:
      tags: [Progress]
      summary: Create valuation period
      parameters:
        - $ref: '#/components/parameters/ContractId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateValuationPeriod'
      responses:
        '201': {description: Created}
  /valuation-periods/{periodId}/progress:
    put:
      tags: [Progress]
      summary: Upsert progress entries
      parameters:
        - name: periodId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProgressEntryInput'
      responses:
        '200': {description: Progress saved}
  /valuation-periods/{periodId}/applications:
    post:
      tags: [Applications]
      summary: Create payment application draft
      parameters:
        - name: periodId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Application draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentApplication'
  /applications/{applicationId}/validate:
    post:
      tags: [Applications]
      summary: Validate application for submission
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Validation result
  /applications/{applicationId}/submit:
    post:
      tags: [Applications]
      summary: Submit immutable application version
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: string}
      responses:
        '200': {description: Submitted}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /projects/{projectId}/variations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Variations]
      summary: List variations
      responses:
        '200': {description: Variation page}
    post:
      tags: [Variations]
      summary: Create variation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariation'
      responses:
        '201': {description: Created}
  /applications/{applicationId}/certificates:
    post:
      tags: [Certificates]
      summary: Record certificate
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificate'
      responses:
        '201': {description: Created}
  /certificates/{certificateId}/invoices:
    post:
      tags: [Invoices]
      summary: Create invoice from certificate
      parameters:
        - name: certificateId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201': {description: Invoice created}
  /payments:
    post:
      tags: [Payments]
      summary: Record and allocate payment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
      responses:
        '201': {description: Payment recorded}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ContractId:
      name: contractId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, maxLength: 128}
  responses:
    ValidationProblem:
      description: Business validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Liveness:
      type: object
      required: [status, service, timestamp]
      additionalProperties: false
      properties:
        status: {type: string, enum: [ok]}
        service: {type: string, example: claims-os-api}
        timestamp: {type: string, format: date-time}
    ReadinessCheck:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, enum: [up, down]}
    Readiness:
      type: object
      required: [status, service, timestamp, checks]
      additionalProperties: false
      properties:
        status: {type: string, enum: [ready, not_ready]}
        service: {type: string, example: claims-os-api}
        timestamp: {type: string, format: date-time}
        checks:
          type: object
          required: [postgresql, redis, objectStorage]
          additionalProperties: false
          properties:
            postgresql: {$ref: '#/components/schemas/ReadinessCheck'}
            redis: {$ref: '#/components/schemas/ReadinessCheck'}
            objectStorage: {$ref: '#/components/schemas/ReadinessCheck'}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+(\\.[0-9]{1,4})?$'
        currency:
          type: string
          minLength: 3
          maxLength: 3
    Project:
      type: object
      required: [id, reference, name, countryCode, currencyCode, status]
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        name: {type: string}
        countryCode: {type: string}
        currencyCode: {type: string}
        status: {type: string}
    ProjectPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Project'}
        total: {type: integer}
    CreateProject:
      type: object
      required: [reference, name, countryCode, currencyCode, timezone]
      properties:
        reference: {type: string}
        name: {type: string}
        clientId: {type: string, format: uuid}
        countryCode: {type: string}
        currencyCode: {type: string}
        timezone: {type: string}
        reportingLocale: {type: string, enum: [en, ar]}
    CreateContract:
      type: object
      required: [reference, currencyCode]
      properties:
        reference: {type: string}
        currencyCode: {type: string}
        originalValue: {type: string}
        retentionRate: {type: string}
        retentionCapType: {type: string}
        retentionCapValue: {type: string}
        advanceAmount: {type: string}
        advanceRecoveryMethod: {type: string}
        advanceRecoveryRate: {type: string}
        paymentTermDays: {type: integer}
        taxRate: {type: string}
    CreateValuationPeriod:
      type: object
      required: [periodNumber, dateFrom, dateTo]
      properties:
        periodNumber: {type: integer}
        dateFrom: {type: string, format: date}
        dateTo: {type: string, format: date}
    ProgressEntryInput:
      type: object
      required: [boqItemId, currentQuantity]
      properties:
        boqItemId: {type: string, format: uuid}
        currentQuantity: {type: string}
        notes: {type: string}
    PaymentApplication:
      type: object
      required: [id, applicationNumber, status]
      properties:
        id: {type: string, format: uuid}
        applicationNumber: {type: integer}
        status: {type: string}
        currentVersionId: {type: string, format: uuid}
    CreateVariation:
      type: object
      required: [reference, title, currencyCode]
      properties:
        reference: {type: string}
        title: {type: string}
        description: {type: string}
        currencyCode: {type: string}
        estimatedValue: {type: string}
    CreateCertificate:
      type: object
      required: [currencyCode, netCertified]
      properties:
        certificateNumber: {type: string}
        certificateDate: {type: string, format: date}
        currencyCode: {type: string}
        grossCertified: {type: string}
        retentionCertified: {type: string}
        advanceRecoveryCertified: {type: string}
        otherDeductionsCertified: {type: string}
        taxCertified: {type: string}
        netCertified: {type: string}
    CreatePayment:
      type: object
      required: [paymentDate, currencyCode, amount, allocations]
      properties:
        clientId: {type: string, format: uuid}
        reference: {type: string}
        paymentDate: {type: string, format: date}
        currencyCode: {type: string}
        amount: {type: string}
        allocations:
          type: array
          items:
            type: object
            required: [invoiceId, amount]
            properties:
              invoiceId: {type: string, format: uuid}
              amount: {type: string}
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        correlationId: {type: string, maxLength: 128}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              code: {type: string}
              message: {type: string}
